<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  .b { position: absolute; bottom: 4px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .main { display: flex; align-items: center; gap: 8px; white-space: nowrap; padding: 5px 12px 5px 5px; border-radius: 12px;
    background: rgba(10, 14, 20, .94); border: 2px solid #2b3545; color: #eef1f5; }
  .best .main { border-color: #42d98a; background: rgba(15, 50, 34, .96); }
  .trap .main { border-color: #ff7070; }
  .g { width: 40px; height: 40px; border-radius: 9px; font-size: 26px; font-weight: 800; line-height: 40px; text-align: center; color: #0b0f14; }
  .gS { background: #ffb347; } .gA { background: #42d98a; } .gB { background: #5b9cf5; } .gC { background: #9aa4b5; } .gD { background: #ff7070; }
  .t { display: flex; flex-direction: column; line-height: 1.15; }
  .t b { font-size: 15px; } .t span { font-size: 11px; color: #9aa4b5; }
  .best .t span { color: #b9f3d3; }
  .x { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: #c895ff; color: #1a0b2a; }
  .x.god { background: #ffb347; color: #0b0f14; } .x.strong { background: #42d98a; color: #062014; } .x.trap, .x.bug { background: #ff7070; color: #2a0808; } .x.item { background: #f0c050; color: #241a02; }
</style>
</head>
<body>
<script>
  const WORD = { S: 'Great', A: 'Good', B: 'Okay', C: 'Weak', D: 'Skip' };
  const COMBO = { god: 'God combo', strong: 'Strong combo', blackTech: 'Niche tech', entertainment: 'Fun build', bug: 'Bugged', trap: 'Trap', combo: 'Combo' };
  const el = (c, t) => { const e = document.createElement('div'); e.className = c; if (t != null) e.textContent = t; return e; };
  window.overlay.onBadges(list => {
    document.body.textContent = '';
    for (const a of list) {
      const trap = a.combo && (a.combo.type === 'trap' || a.combo.type === 'bug');
      const e = el('b' + (a.best ? ' best' : '') + (trap ? ' trap' : '')); e.style.left = a.x + 'px';
      // extra line on top: combo for this champion, or the item this augment needs
      if (a.combo) e.append(el('x ' + a.combo.type, (COMBO[a.combo.type] || 'Combo') + (a.combo.with && a.combo.with.length ? ' with ' + a.combo.with.join(' + ') : '')));
      else if (a.item) e.append(el('x item', 'Build ' + a.item));
      const m = el('main'); const t = el('t');
      const b = document.createElement('b'); b.textContent = a.best ? 'Best pick' : WORD[a.grade] || '';
      const s = document.createElement('span'); s.textContent = a.pickRate != null ? Math.round(a.pickRate) + '% pick it' : '';
      t.append(b, s); m.append(el('g g' + a.grade, a.grade), t); e.append(m); document.body.append(e);
    }
  });
</script>
</body>
</html>
