<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' https://static.bigbrain.gg https://ddragon.leagueoflegends.com">
<style>
  :root { --bg:#0d1117; --card:#161c26; --line:#232b38; --text:#eef1f5; --dim:#8d97a8;
    --pris:#c895ff; --gold:#f0c050; --silver:#c3ccd8; --good:#42d98a; --bad:#ff7070; --accent:#5b9cf5; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 13px/1.35 "Segoe UI", system-ui, sans-serif; user-select: none; }
  body { display: flex; flex-direction: column; }
  button, input { font: inherit; color: inherit; -webkit-app-region: no-drag; }
  button { background: none; border: 0; cursor: pointer; }

  header { -webkit-app-region: drag; display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 12px; }
  #cimg { width: 36px; height: 36px; border-radius: 8px; background: var(--card); flex: none; object-fit: cover; }
  .who { flex: 1; min-width: 0; }
  #champ { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sub { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .x { width: 28px; height: 28px; border-radius: 6px; color: var(--dim); font-size: 14px; }
  .x:hover { background: var(--card); color: var(--text); }

  nav { display: flex; padding: 0 12px; gap: 4px; border-bottom: 1px solid var(--line); }
  nav button { flex: 1; padding: 8px 0 9px; color: var(--dim); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  nav button:hover { color: var(--text); }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); }

  main { flex: 1; overflow-y: auto; padding: 4px 12px 14px; }
  main::-webkit-scrollbar { width: 8px; } main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; border: 2px solid var(--bg); }
  .msg { color: var(--dim); padding: 28px 10px; text-align: center; white-space: pre-line; line-height: 1.6; }
  .msg b { color: var(--text); }
  kbd { display: inline-block; padding: 1px 7px; border-radius: 5px; background: var(--card); border: 1px solid var(--line); border-bottom-width: 2px; font: inherit; font-weight: 600; color: var(--text); }

  h2 { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin: 16px 0 6px; display: flex; align-items: center; gap: 7px; }
  h2::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
  h2 span { color: var(--dim); font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: auto; }
  .prismatic { color: var(--pris); } .gold { color: var(--gold); } .silver { color: var(--silver); } .now { color: var(--good); }

  .row { display: grid; grid-template-columns: 22px 30px 1fr auto; align-items: center; column-gap: 9px; padding: 5px 6px; border-radius: 8px; color: var(--text); cursor: pointer; }
  .row:hover { background: var(--card); }
  .g { width: 22px; height: 22px; border-radius: 6px; font-weight: 800; font-size: 12px; text-align: center; line-height: 22px; color: #0b0f14; }
  .gS { background: #ffb347; } .gA { background: #42d98a; } .gB { background: #5b9cf5; } .gC { background: #9aa4b5; } .gD { background: #ff7070; } .gx { background: var(--card); }
  .row img, .ph { width: 30px; height: 30px; border-radius: 7px; background: var(--card); display: block; }
  .row .name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .side { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .desc { grid-column: 3 / 5; color: var(--dim); font-size: 12px; white-space: pre-line; padding-top: 3px; display: none; user-select: text; }
  .row.open .desc { display: block; } .row.open .name { white-space: normal; }
  .row.took .name { color: var(--good); } .desc.acts { padding-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; } .tchip { display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-size: 12px; }
  .tchip button { color: var(--dim); width: 18px; height: 18px; border-radius: 50%; } .tchip button:hover { background: var(--line); color: var(--text); }
  .sug { display: grid; grid-template-columns: 30px 1fr; column-gap: 9px; align-items: center; padding: 4px 0; } .sug img { width: 30px; height: 30px; border-radius: 7px; background: var(--bg); }
  .sug .why { color: var(--dim); font-size: 12px; } .sug b { font-weight: 600; } .sug i { color: var(--gold); font-style: normal; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  .seen { color: var(--dim); font-size: 12px; padding: 2px 0 4px; }
  .more { display: block; width: 100%; text-align: left; color: var(--dim); padding: 6px 6px 6px 37px; border-radius: 8px; }
  .more:hover { color: var(--text); background: var(--card); }

  #offer { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 4px 6px 6px; background: #111a24; display: none; }
  #offer.show { display: block; }
  #offer h2 { margin: 8px 6px 6px; }
  #offer .row { cursor: default; } #offer .row:hover { background: none; }
  #offer .row.best { background: #173d2a; }
  #offer .desc { display: block; }
  .pill { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--good); color: #062014; }
  .hint { color: var(--dim); font-size: 12px; padding: 6px; display: flex; align-items: center; gap: 8px; }
  .link { color: var(--accent); font-size: 12px; padding: 2px 4px; border-radius: 4px; } .link:hover { background: var(--card); }

  .box { background: var(--card); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .box h3 { font-size: 12px; font-weight: 600; color: var(--dim); display: flex; justify-content: space-between; margin-bottom: 8px; }
  .item { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; column-gap: 9px; padding: 3px 0; }
  .item img { width: 30px; height: 30px; border-radius: 7px; background: var(--bg); }
  .item .name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wr { font-variant-numeric: tabular-nums; font-weight: 600; } .wr.hi { color: var(--good); } .wr.lo { color: var(--bad); }
  .flow { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
  .flow b { font-size: 15px; } .flow i { color: var(--dim); font-style: normal; }
  .note { color: var(--dim); font-size: 11px; margin-top: 12px; line-height: 1.5; }

  footer { border-top: 1px solid var(--line); padding: 7px 10px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
  footer input { flex: 1; min-width: 0; height: 26px; background: var(--card); border: 1px solid var(--line); border-radius: 7px; padding: 0 9px; outline: none; color: var(--text); }
  footer input:focus { border-color: var(--accent); }
  .chip { height: 26px; padding: 0 9px; border-radius: 7px; background: var(--card); border: 1px solid var(--line); color: var(--text); white-space: nowrap; }
  .chip:hover { border-color: var(--accent); }
  .chip.off { color: var(--dim); } .chip.err { border-color: var(--bad); }
  .chip.rec { border-color: var(--accent); color: var(--accent); }
  footer.keys { border-top: 0; padding-top: 0; } #keymsg { color: var(--bad); margin-left: auto; }
  .tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
  .tag.god { background: #ffb347; color: #0b0f14; } .tag.strong { background: #42d98a; color: #062014; } .tag.fun { background: #c895ff; color: #1a0b2a; } .tag.trap, .tag.bug { background: #ff7070; color: #2a0808; }
  .extra { grid-column: 3 / 5; font-size: 12px; color: var(--pris); padding-top: 2px; } .extra.need { color: var(--gold); }
  .combo { padding: 6px 2px; border-top: 1px solid var(--line); } .combo:first-of-type { border-top: 0; } .combo .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }
  #credit { padding: 0 10px 6px; font-size: 10px; color: #5f6878; } #credit a { color: inherit; }
</style>
</head>
<body>
  <header>
    <img id="cimg" alt="" style="visibility:hidden">
    <div class="who"><div id="champ">ARAM Mayhem</div><div id="sub">Waiting for League</div></div>
    <button class="x" id="hide" title="Hide">–</button>
    <button class="x" id="quit" title="Quit">✕</button>
  </header>
  <nav><button id="tA">Augments</button><button id="tI">Items</button></nav>
  <main id="main"></main>
  <footer>
    <input id="search" type="text" list="champs" placeholder="Look up a champion…" spellcheck="false">
    <datalist id="champs"></datalist>
    <button class="chip" id="cards" title="Show grade badges above the augment cards at pick time">Badges</button>
  </footer>
  <footer class="keys">
    <span>Panel</span><button class="chip" id="key" title="Click, then press the key you want">F9</button>
    <span>Badges</span><button class="chip" id="bkey" title="Click, then press the key you want">F10</button>
    <span id="keymsg"></span>
  </footer>
  <div id="credit">Data: <a href="https://u.gg" target="_blank">U.GG</a> · <a href="https://arammayhem.com/data/" target="_blank">arammayhem.com</a> <span id="patch"></span> <span id="ver" style="float:right"></span></div>
<script>
  const $ = id => document.getElementById(id);
  const o = window.overlay;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const SHOWN = 6, TOP = 3;
  const LABEL = { prismatic: 'Prismatic', gold: 'Gold', silver: 'Silver' };
  const keyName = k => (k || '').replace('Control', 'Ctrl').replace(/\+/g, ' + ');
  let TAKEN = [], SITU = null;
  let S = { phase: 'idle', key: 'F9', tab: 'augments', readCards: true }, D = null, OFFER = { status: 'idle', list: [] }, expanded = new Set(), loading = null;

  function fillChamps() { o.champions().then(l => { if (l.length) $('champs').innerHTML = l.map(c => `<option value="${c.name.replace(/"/g, '&quot;')}">`).join(''); }); }
  fillChamps();
  function img(src) { const i = el('img'); if (src) i.src = src; i.onerror = () => { i.removeAttribute('src'); i.style.visibility = 'hidden'; }; return i; }
  function wr(v) { const s = el('span', 'wr', v == null ? '' : v.toFixed(1) + '%'); if (v != null) s.classList.add(v >= 52 ? 'hi' : v < 48 ? 'lo' : 'mid'); return s; }
  function find(id) { for (const l of Object.values(D.rarities || {})) { const a = l.find(x => x.id === id); if (a) return a; } return null; }

  function augRow(a, opts = {}) {
    const row = el('div', 'row' + (a.rank <= TOP ? ' top' : '') + (opts.best ? ' best' : ''));
    const g = el('span', 'g g' + (a.grade || 'x'), a.grade || '');
    row.append(g, img(a.img), el('span', 'name', a.name));
    if (opts.best) row.append(el('span', 'pill', 'PICK'));
    else row.append(el('span', 'side', opts.side || (a.pickRate != null ? a.pickRate.toFixed(0) + '%' : '')));
    if (a.combo) { const nm = row.querySelector('.name'); nm.append(tag(a.combo.type)); }
    if (a.label) row.append(el('div', 'extra' + (a.combo ? '' : ' need'), a.label));
    else {
      if (a.combo && a.combo.with && a.combo.with.length) row.append(el('div', 'extra', 'Combo with ' + a.combo.with.join(' + ')));
      if (a.items && a.items.length) row.append(el('div', 'extra need', 'Needs ' + a.items.map(i => i.name).join(' or ')));
    }
    if (TAKEN.some(t => t.id === a.id)) row.classList.add('took');
    if (!opts.fixed) { const d = el('div', 'desc acts'); const b = el('button', 'link', TAKEN.some(t => t.id === a.id) ? 'Remove from my augments' : 'I took this'); b.onclick = e => { e.stopPropagation(); o.toggleTaken(a.id); }; d.append(b); row.append(d); }
    row.append(el('div', 'desc', a.desc || 'No description yet.'));
    if (!opts.fixed) row.onclick = () => row.classList.toggle('open');
    return row;
  }

  const TAG = { god: ['god', 'God combo'], strong: ['strong', 'Strong combo'], blackTech: ['fun', 'Niche tech'], entertainment: ['fun', 'Fun build'], bug: ['bug', 'Bugged'], trap: ['trap', 'Trap'], combo: ['fun', 'Combo'] };
  function tag(type) { const t = TAG[type] || TAG.combo; return el('span', 'tag ' + t[0], t[1]); }
  function combosBox() {
    const list = (D.combos || []); if (!list.length) return null;
    const ORDER = ['god', 'strong', 'blackTech', 'entertainment', 'bug', 'trap'];
    const typeOf = c => ORDER.find(t => c.types.includes(t)) || 'combo';
    const box = el('div', 'box'); const h = el('h3'); h.append(el('span', null, 'Combos and niche builds'), el('span', null, list.length)); box.append(h);
    [...list].sort((a, b) => ORDER.indexOf(typeOf(a)) - ORDER.indexOf(typeOf(b))).slice(0, 10).forEach(c => {
      const r = el('div', 'combo'); const line = el('div', null, c.augments.join(' + ')); line.append(tag(typeOf(c))); r.append(line);
      const items = []; c.augments.forEach(n => { const a = findName(n); if (a && a.items) a.items.forEach(i => items.push(i.name)); });
      if (items.length) r.append(el('div', 'sub', 'Build ' + [...new Set(items)].join(', ')));
      box.append(r);
    });
    return box;
  }
  function findName(n) { const k = n.toLowerCase(); for (const l of Object.values(D.rarities || {})) { const a = l.find(x => x.name.toLowerCase() === k); if (a) return a; } return null; }

  function takenBox() {
    const box = el('div', 'box'); const h = el('h3'); h.append(el('span', null, 'Your augments this game'), el('span', null, TAKEN.length || '')); box.append(h);
    if (!TAKEN.length) { box.append(el('div', 'seen', 'None tracked yet. Picks are added when the cards close. Wrong one? Open an augment below and click "I took this".')); return box; }
    const c = el('div', 'chips');
    TAKEN.forEach(t => { const chip = el('div', 'tchip'); chip.append(el('span', null, t.name)); const x = el('button', null, '✕'); x.title = 'Remove'; x.onclick = () => o.toggleTaken(t.id); chip.append(x); c.append(chip); });
    box.append(c); return box;
  }
  function situationBox() {
    if (S.phase !== 'game' || !SITU) return null;
    const box = el('div', 'box'); const h = el('h3');
    const e = SITU.enemy; h.append(el('span', null, 'For this game')); box.append(h);
    if (e) box.append(el('div', 'seen', `Enemy team: ${e.ad} physical · ${e.ap} magic · ${e.tanks} tank · ${e.healers} healer`));
    if (!SITU.suggestions.length) box.append(el('div', 'seen', 'Nothing special needed. Follow the usual build below.'));
    SITU.suggestions.forEach(s => { const r = el('div', 'sug'); const t = el('div'); const top = el('div'); top.append(el('i', null, s.title + '  '), el('b', null, s.name)); t.append(top, el('div', 'why', s.why)); r.append(img(s.img), t); box.append(r); });
    (SITU.seen || []).forEach(p => box.append(el('div', 'seen', `${p.enemy ? 'Enemy' : 'Ally'} ${p.name} has ${p.augments.join(', ')}`)));
    return box;
  }

  function offerBlock() {
    const box = el('section'); box.id = 'offer';
    if (S.phase !== 'game' || OFFER.status === 'idle' || OFFER.status === 'off') { if (S.phase === 'game' && S.readCards) { const b = el('button', 'link', 'Read cards now'); b.onclick = o.readCards; const w = el('div', 'hint'); w.append(b); box.append(w); box.classList.add('show'); } return box; }
    box.classList.add('show');
    const h = el('h2', 'now', 'On your screen'); box.append(h);
    if (OFFER.status === 'reading') { box.append(el('div', 'hint', 'Reading the cards…')); return box; }
    if (OFFER.status === 'found') {
      [...OFFER.list].sort((a, b) => a.rank / a.total - b.rank / b.total).forEach(x => {
        const a = find(x.id) || x;
        box.append(augRow({ ...a, rank: x.rank, grade: x.grade, combo: x.combo || a.combo, label: x.label }, { best: x.best, fixed: true }));
      });
    } else {
      const hint = el('div', 'hint', OFFER.status === 'error' ? 'Could not read the screen on this PC.' : 'No augment cards found on screen.');
      box.append(hint);
    }
    const again = el('button', 'link', 'Read again'); again.onclick = o.readCards;
    const w = el('div', 'hint'); w.append(again); box.append(w);
    return box;
  }

  function renderAugments(m) {
    if (!D.rarities) { m.append(el('div', 'msg', (D.errors || []).join('\n') || 'No augment data for this champion yet.')); return; }
    m.append(offerBlock());
    if (S.phase === 'game') m.append(takenBox());
    const cb = combosBox(); if (cb) m.append(cb);
    for (const key of ['prismatic', 'gold', 'silver']) {
      const all = D.rarities[key] || []; if (!all.length) continue;
      const h = el('h2', key, LABEL[key]); h.append(el('span', null, 'best first')); m.append(h);
      const open = expanded.has(key);
      (open ? all : all.slice(0, SHOWN)).forEach(a => m.append(augRow(a)));
      if (all.length > SHOWN) {
        const b = el('button', 'more', open ? 'Show less' : `Show all ${all.length}`);
        b.onclick = () => { open ? expanded.delete(key) : expanded.add(key); render(); };
        m.append(b);
      }
    }
    m.append(el('div', 'note', 'Grade = how high U.GG ranks it for this champion. % = how often players pick it overall. Click an augment to read what it does.'));
  }

  function itemBox(title, right, items) {
    const b = el('div', 'box'); const h = el('h3'); h.append(el('span', null, title), el('span', null, right || '')); b.append(h);
    items.forEach(it => { const r = el('div', 'item'); r.append(img(it.img), el('span', 'name', it.name), it.wr != null ? wr(it.wr) : el('span')); b.append(r); });
    return b;
  }
  function renderItems(m) {
    const b = D.build;
    if (!b) { m.append(el('div', 'msg', 'No item data for this champion yet.')); return; }
    const sb = situationBox(); if (sb) m.append(sb);
    if (b.start) m.append(itemBox('Start with', '', dedupe(b.start.items)));
    if (b.core) m.append(itemBox('Build first', b.core.wr != null ? b.core.wr.toFixed(1) + '% win' : '', b.core.items));
    ['4th item', '5th item', '6th item'].forEach((t, i) => {
      const opts = (b.options[i] || []).slice().sort((x, y) => (y.wr || 0) - (x.wr || 0)).slice(0, 3);
      if (opts.length) m.append(itemBox(t, 'win rate', opts));
    });
    if (b.skillPriority) {
      const box = el('div', 'box'); const h = el('h3'); h.append(el('span', null, 'Max skills in this order')); box.append(h);
      const f = el('div', 'flow'); b.skillPriority.split('').forEach((k, i) => { if (i) f.append(el('i', null, '›')); f.append(el('b', null, k)); }); box.append(f); m.append(box);
    }
    if (b.spells && b.spells.length) m.append(itemBox('Summoner spells', '', b.spells));
    m.append(el('div', 'note', '"For this game" reads both teams and their items from League, and your augments. It updates by itself. Item stats below come from regular ARAM games.'));
  }
  function dedupe(items) { const m = new Map(); items.forEach(i => { const e = m.get(i.id); if (e) e.count++; else m.set(i.id, { ...i, count: 1 }); }); return [...m.values()].map(i => ({ ...i, name: i.count > 1 ? `${i.name} ×${i.count}` : i.name })); }

  function render() {
    $('tA').classList.toggle('on', S.tab === 'augments'); $('tI').classList.toggle('on', S.tab === 'items');
    const m = $('main'); const top = m.scrollTop; m.textContent = '';
    if (loading) { m.append(el('div', 'msg', 'Loading ' + loading + '…')); return; }
    if (!D) {
      const w = el('div', 'msg');
      w.append('Queue for ', el('b', null, 'ARAM Mayhem'), '.\nThis panel opens on your champion\nin champ select.\n\nIt hides when the game starts.\nPress ', el('kbd', null, keyName(S.key)), ' to show or hide it.');
      m.append(w); return;
    }
    S.tab === 'items' ? renderItems(m) : renderAugments(m);
    m.scrollTop = top;
  }

  o.onState(s => {
    const tabChanged = s.tab !== S.tab, phaseChanged = s.phase !== S.phase, keyChanged = s.key !== S.key;
    S = s;
    $('sub').textContent = (D && D.tier ? D.tier + ' tier · ' : '') + ({ idle: 'Waiting for League', select: 'Champ select', game: 'In game' })[s.phase];
    if (!recording) { $('key').textContent = keyName(s.key); $('bkey').textContent = keyName(s.badgeKey); }
    $('cards').classList.toggle('off', !s.readCards);
    $('cards').textContent = s.readCards ? 'Badges: on' : 'Badges: off';
    const bad = s.readCards && /^error/.test(s.ocr || '');
    $('cards').classList.toggle('err', bad);
    $('cards').title = bad ? 'Screen reading is not working: ' + s.ocr.slice(7) : 'Show grade badges above the augment cards at pick time';
    if (!$('champs').children.length) fillChamps();
    $('ver').textContent = s.version ? 'v' + s.version + (s.updated ? ' · just updated' : '') : '';
    if (tabChanged || phaseChanged || (keyChanged && !D)) render();
  });
  o.onLoading(c => { loading = c.name; $('champ').textContent = c.name; render(); });
  o.onData(d => {
    loading = null; D = d; expanded = new Set(); OFFER = { status: 'idle', list: [] };
    $('champ').textContent = d.champ.name;
    const ci = $('cimg'); ci.style.visibility = 'visible'; if (d.champImg) ci.src = d.champImg; else ci.removeAttribute('src');
    $('sub').textContent = (d.tier ? d.tier + ' tier · ' : '') + ({ idle: 'Waiting for League', select: 'Champ select', game: 'In game' })[S.phase];
    $('patch').textContent = d.patch ? '· patch ' + d.patch.replace('_', '.') : '';
    $('main').scrollTop = 0; render();
  });
  o.onTaken(l => { TAKEN = l || []; if (D) render(); });
  o.onSituation(x => { SITU = x; if (D && S.tab === 'items') render(); });
  o.onOffer(x => { OFFER = x; if (D && S.tab === 'augments') { render(); if (x.status !== 'idle') $('main').scrollTop = 0; } });

  $('search').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim()) { o.pick(e.target.value); e.target.value = ''; e.target.blur(); } });
  $('search').addEventListener('change', e => { if ([...$('champs').options].some(x => x.value === e.target.value)) { o.pick(e.target.value); e.target.value = ''; } });
  $('tA').onclick = () => o.tab('augments'); $('tI').onclick = () => o.tab('items');
  $('cards').onclick = o.toggleReadCards;
  // Click a key chip, then press any key (with Ctrl / Alt / Shift if you like). Esc cancels.
  let recording = null;
  function record(which, btn) {
    if (recording) return;
    recording = which; o.pauseKeys(); btn.classList.add('rec'); btn.textContent = 'Press a key…'; $('keymsg').textContent = '';
    const done = accel => { window.removeEventListener('keydown', onKey, true); btn.classList.remove('rec'); recording = null; o.setKey(which, accel); };
    const onKey = e => {
      e.preventDefault(); e.stopPropagation();
      if (['Control', 'Shift', 'Alt', 'Meta'].includes(e.key)) return;
      if (e.key === 'Escape') return done(null);
      let k = e.key;
      if (/^F\d{1,2}$/.test(k)) { /* keep */ }
      else if (/^[a-z0-9]$/i.test(k)) k = k.toUpperCase();
      else if (k === ' ') k = 'Space';
      else if (/^Arrow/.test(k)) k = k.slice(5);
      else if (['Tab', 'Insert', 'Delete', 'Home', 'End', 'PageUp', 'PageDown', '`', '-', '=', '[', ']', '\\', ';', "'", ',', '.', '/'].includes(k)) { /* keep */ }
      else return;
      done([e.ctrlKey && 'Control', e.altKey && 'Alt', e.shiftKey && 'Shift', k].filter(Boolean).join('+'));
    };
    window.addEventListener('keydown', onKey, true);
  }
  $('key').onclick = () => record('key', $('key'));
  $('bkey').onclick = () => record('badgeKey', $('bkey'));
  o.onKeyError(k => { $('keymsg').textContent = keyName(k) + ' is taken'; setTimeout(() => ($('keymsg').textContent = ''), 4000); });
  $('hide').onclick = o.hide; $('quit').onclick = o.quit;
  $('cimg').onerror = () => ($('cimg').style.visibility = 'hidden');
  render();
</script>
</body>
</html>
